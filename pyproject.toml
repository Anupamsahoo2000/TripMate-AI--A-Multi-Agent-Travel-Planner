[project]
name = "tripmate-ai-a-multi-agent-travel-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anupam2000", email = "anupamsahoo2000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
tripmate-ai-a-multi-agent-travel-planner = "tripmate_ai_a_multi_agent_travel_planner:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
